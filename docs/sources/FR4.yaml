id: "FR4"
reference: "Observatoire parisien des libertés publiques (LDH Paris, Syndicat des avocats de France), « La stratégie de la nasse contre le droit de manifester », rapport sur le 16 novembre 2019"
url: "https://www.ldh-france.org/wp-content/uploads/2019/04/Rapport-16-novembre-2019-La-strate%CC%81gie-de-la-nasse-contre-le-droit-de-manifester.pdf"
type_source: "ONG, observation directe (équipes d'observateurs sur place)"
pays: "France"
