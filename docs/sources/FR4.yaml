periode_observee: "16/11/2019, de 10 h 30 à peu après 15 h 49 pour les équipes de la place d'Italie"
date_publication: "2020-01-24"
statut_lecture: "lu : p. 5-7, 20-23, 25"
mecanisme_decrit: "Fermeture des débouchés de la place : entrée possible, sortie impossible ; nasse hermétique ; gaz lacrymogènes, grenades et canons à eau dans la nasse ; sorties filtrées par groupes à la décision des forces de l'ordre ; refus opposés aux personnes qui s'approchent des cordons ; aucune information sur une sortie."
chiffres:
  - valeur: "nasse hermétique constatée à 13 h 48"
    passage: "p. 6"
    conversion_modele: "début de l'enfermement"
  - valeur: "ouverture de la nasse signalée à 15 h 49, boulevard Vincent-Auriol"
    passage: "p. 7"
    conversion_modele: "≈ 2 h 01 après la fermeture, soit ≈ 726 pas"
  - valeur: "94 personnes prises en charge par la coordination de premiers secours"
    passage: "p. 6"
    conversion_modele: "sans objet"
  - valeur: "trois canons à eau positionnés boulevard de l'Hôpital, boulevard Vincent-Auriol et avenue d'Italie, tournés vers le centre de la place"
    passage: "p. 20"
    conversion_modele: "sans objet"
  - valeur: "« Les sorties étaient filtrées par les forces de l'ordre, lesquelles décidaient ou non de laisser sortir des groupes de personnes. »"
    passage: "p. 22"
    conversion_modele: "aucun débit chiffré"
  - valeur: "« Les personnes n'étaient pas informées d'une sortie et se voyaient opposer un refus lorsqu'elles se risquaient à s'approcher des cordons de police. »"
    passage: "p. 23"
    conversion_modele: "sans objet"
