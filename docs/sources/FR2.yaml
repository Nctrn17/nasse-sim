id: "FR2"
reference: "Conseil d'État, décision du 29 décembre 2023, n° 461513 et autres, sur le schéma national du maintien de l'ordre (SNMO)"
url: "https://www.conseil-etat.fr/fr/arianeweb/CE/decision/2023-12-29/461513"
type_source: "juridiction"
pays: "France"
lieu_observe: "sans objet (contrôle d'un texte national)"
periode_observee: "SNMO dans sa version du 16 décembre 2021"
date_publication: "2023-12-29"
statut_lecture: "lu : texte intégral, points 9 à 15 et dispositif"
mecanisme_decrit: "Le point 3.1.4 du SNMO réserve l'encerclement à la prévention ou à la cessation de violences graves et imminentes, impose de ménager un point de sortie contrôlé dès que l'ordre public le permet et limite la durée au strict nécessaire. Le Conseil d'État rejette la demande d'annulation de ce point ; il n'annule que le point 2.2.3.3, en tant qu'il exclut les observateurs indépendants."
chiffres:
  - valeur: "« Cet encerclement doit, dès que les circonstances de l'ordre public le permettent, systématiquement ménager un point de sortie contrôlé pour ces personnes. »"
    passage: "point 9 (citation du point 3.1.4 du SNMO)"
    conversion_modele: "un point de sortie, au singulier ; aucun délai chiffré"
  - valeur: "« une durée strictement nécessaire et proportionnée »"
    passage: "point 9"
    conversion_modele: "aucune durée chiffrée"
  - valeur: "le point de sortie peut ne pas être ménagé lorsque « les contraintes particulières d'ordre public y fassent obstacle »"
    passage: "point 13"
    conversion_modele: "un scénario sans sortie reste juridiquement possible"
  - valeur: "le point de sortie « n'a pas pour objet et ne saurait avoir légalement pour effet » de permettre des contrôles d'identité hors de l'article 78-2 du code de procédure pénale"
    passage: "point 14"
    conversion_modele: "sans objet"
parametres_identifiables:
  - parametre: "gate_count"
    file: "exit_env.py"
    apport: "borne : un point de sortie contrôlé"
  - parametre: "scénario sealed"
    file: "exit_env.py"
    apport: "mécanisme seulement : possible en droit sous contraintes d'ordre public"
  - parametre: "first_open_min/max"
    file: "exit_env.py"
    apport: "mécanisme seulement : ouverture conditionnée à l'ordre public, sans délai"
  - parametre: "outside_hold et retrait du groupe"
    file: "exit_env.py"
    apport: "mécanisme seulement : la sortie est contrôlée ; le contrôle d'identité suppose une autre base légale"
qualite: "décision de justice, texte intégral publié par la juridiction"
incertitudes: "la décision juge la légalité d'un texte, pas la façon dont il est appliqué"
ne_permet_pas_de_conclure: "la durée réelle des nasses, le délai avant ouverture, le débit ou la largeur d'un point de sortie, la fréquence à laquelle ces conditions sont respectées"
